[package]
name = "larmindon-core"
version = "0.1.0"
description = "Core audio/ASR engine for Larmindon transcription tool"
authors = ["edmistond"]
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rubato = "0.14"
parakeet-rs = "0.3.5"
rusqlite = { version = "0.31", features = ["bundled"] }
ort = "2.0.0-rc.12"
ndarray = "0.17"
cpal = { version = "0.17", optional = true }

# Soniox cloud backend. native-tls rather than rustls: native-tls is already in
# this build via ureq <- ort, so it adds no new native build step, and it uses
# schannel on Windows. A rustls stack would pull in ring or aws-lc-rs, whose
# NASM/cmake build scripts run through the hand-written MSVC INCLUDE/LIB
# overrides in .cargo/config.toml.
tokio = { version = "1", features = [
    "rt",
    "net",
    "time",
    "sync",
    "macros",
], optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = [
    "connect",
    "native-tls",
], optional = true }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.9", optional = true }
libspa = { version = "0.9", optional = true }

# Windows-only per-application capture via WASAPI process loopback. These are
# non-optional and target-gated, so the backend is compiled (and used by default)
# on Windows, while macOS/Linux builds never reference them. windows 0.62 is
# already resolved transitively here, so it's reused rather than adding a second
# version. Features cover audio-session enumeration (IAudioSessionManager2) and
# process-name resolution.
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[features]
default = ["cpal", "pipewire", "asr-soniox"]
asr-soniox = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
webgpu = ["parakeet-rs/webgpu"]
directml = ["parakeet-rs/directml"]
migraphx = ["parakeet-rs/migraphx"]
pipewire = ["dep:pipewire", "dep:libspa"]
cpal = ["dep:cpal"]
